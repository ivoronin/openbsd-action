name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/actionlint"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$install_dir"

          gh release download "v${ACTIONLINT_VERSION}" \
            --repo rhysd/actionlint \
            --pattern "$archive" \
            --dir "$install_dir" \
            --clobber

          gh attestation verify "$install_dir/$archive" \
            --repo rhysd/actionlint \
            --deny-self-hosted-runners

          tar -xzf "$install_dir/$archive" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint

  shellcheck:
    runs-on: ubuntu-24.04
    needs: actionlint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install ShellCheck
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  openbsd:
    name: ${{ matrix.arch }} (${{ matrix.accel }})
    runs-on: ubuntu-24.04
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            accel: kvm
            image: openbsd-79-generic-full-amd64-bios-2bd66ca-202607080953.tar.gz
            ports: true
            ports_archive_url_prefix: https://cdn.openbsd.org/pub/OpenBSD/7.9
          - arch: arm64
            accel: tcg
            image: openbsd-79-generic-full-arm64-uefi-2bd66ca-202607080953.tar.gz
            ports: false
            ports_archive_url_prefix: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run local action
        uses: ./
        with:
          release: "20260708"
          image: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          ports: ${{ matrix.ports }}
          ports-archive-url-prefix: ${{ matrix.ports_archive_url_prefix }}
          run: |
            uname -a
            if [ '${{ matrix.ports }}' = true ]; then
              test -f /usr/ports/infrastructure/mk/bsd.port.mk
              pkgname=$(
                cd /usr/ports/devel/gmake
                make show=PKGNAME
              )
              case "$pkgname" in
                gmake-*) ;;
                *) echo "unexpected PKGNAME: $pkgname" >&2; exit 1 ;;
              esac
            fi
            printf '%s\n' '${{ matrix.arch }} e2e ok' > openbsd-action-e2e-${{ matrix.arch }}.txt
      - name: Check synced output
        run: test -s "openbsd-action-e2e-${{ matrix.arch }}.txt"
