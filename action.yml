name: OpenBSD Action
description: Run a command in an OpenBSD QEMU VM booted from an attested image

inputs:
  repo:
    description: GitHub owner/name repository containing the OpenBSD image release
    required: false
    default: ivoronin/openbsd-cloudimg
  release:
    description: Release tag in the image repository
    required: true
  image:
    description: Exact image release asset name
    required: true
  arch:
    description: OpenBSD image architecture, amd64 or arm64
    required: true
  ports:
    description: Prepare /usr/ports before running the command
    required: false
    default: "false"
  ports-archive-url-prefix:
    description: URL prefix containing ports.tar.gz and SHA256.sig
    required: false
    default: ""
  ports-cvs-root:
    description: AnonCVS root used to update /usr/ports, for example anoncvs@host:/cvs
    required: false
    default: ""
  ports-cvs-ref:
    description: CVS ref for /usr/ports; required with ports-cvs-root, current uses CVS -A
    required: false
    default: ""
  run:
    description: Command to run inside /home/openbsd/work
    required: true

runs:
  using: composite
  steps:
    - name: Prepare host
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          openssh-client \
          rsync \
          xorriso \
          qemu-system-x86 \
          qemu-system-arm \
          qemu-efi-aarch64 \
          tar \
          gzip

        if [ -e /dev/kvm ]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        fi

    - name: Prepare runtime
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_PORTS: ${{ inputs.ports }}
      run: bash "${{ github.action_path }}/scripts/prepare-runtime.sh"

    - name: Download image
      shell: bash
      run: |
        gh release download "$OBA_RELEASE" --repo "$OBA_REPO" --pattern "$OBA_IMAGE" --dir "$OBA_ROOT" --clobber
        mv "$OBA_ROOT/$OBA_IMAGE" "$OBA_ARCHIVE"

    - name: Verify image attestation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh attestation verify "$OBA_ARCHIVE"
        --repo "$OBA_REPO"
        --signer-workflow "github.com/$OBA_REPO/.github/workflows/build.yml"
        --source-ref "refs/tags/$OBA_RELEASE"
        --deny-self-hosted-runners

    - name: Extract sparse disk
      shell: bash
      run: tar -xOzf "$OBA_ARCHIVE" disk.raw | dd "of=$OBA_DISK" bs=64K iflag=fullblock conv=sparse

    - name: Prepare guest access
      shell: bash
      run: |
        set -euo pipefail

        ssh-keygen -q -t ed25519 -f "$OBA_SSH_KEY" -N "" -C openbsd-action
        chmod 600 "$OBA_SSH_KEY"
        touch "$OBA_KNOWN_HOSTS"

        cat > "$OBA_SSH_CONFIG" <<EOF
        Host openbsd-action
          HostName 127.0.0.1
          Port $OBA_PORT
          User openbsd
          IdentityFile $OBA_SSH_KEY
          IdentitiesOnly yes
          BatchMode yes
          StrictHostKeyChecking accept-new
          UserKnownHostsFile $OBA_KNOWN_HOSTS
          CheckHostIP no
          LogLevel ERROR
        EOF
        chmod 600 "$OBA_SSH_CONFIG" "$OBA_KNOWN_HOSTS"

        cat > "$OBA_CIDATA/meta-data" <<EOF
        instance-id: openbsd-action-$GITHUB_RUN_ID
        local-hostname: openbsd-action
        public-keys:
          - $(cat "$OBA_SSH_KEY.pub")
        EOF

        (
          cd "$OBA_CIDATA"
          xorriso -as mkisofs -V CIDATA -J -r -o "$OBA_CIDATA_ISO" meta-data
        )

    - name: Boot OpenBSD
      shell: bash
      run: bash "${{ github.action_path }}/scripts/boot-openbsd.sh"

    - name: Wait for SSH
      shell: bash
      run: |
        set -euo pipefail

        last_error="$OBA_ROOT/ssh.last-error"
        for _ in $(seq 1 90); do
          if ! kill -0 "$(cat "$OBA_QEMU_PID")" 2>/dev/null; then
            echo "qemu exited before SSH became available" >&2
            exit 1
          fi
          ssh -F "$OBA_SSH_CONFIG" openbsd-action true 2>"$last_error" && exit 0
          sleep 2
        done

        echo "timed out waiting for SSH" >&2
        cat "$last_error" >&2 || true
        exit 1

    - name: Install rsync
      shell: bash
      run: >-
        ssh -F "$OBA_SSH_CONFIG" openbsd-action
        'doas pkg_add -I rsync-- && /usr/local/bin/rsync --version >/dev/null && mkdir -p /home/openbsd/work'

    - name: Sync action scripts
      shell: bash
      run: |
        set -euo pipefail

        rsync -a \
          --rsync-path=/usr/local/bin/rsync \
          -e "ssh -F $OBA_SSH_CONFIG" \
          "${{ github.action_path }}/scripts/" \
          openbsd-action:/tmp/openbsd-action-scripts/

        ssh -F "$OBA_SSH_CONFIG" openbsd-action \
          'chmod -R u+rwX,go+rX /tmp/openbsd-action-scripts && find /tmp/openbsd-action-scripts -type f -name "*.sh" -exec chmod 755 {} \;'

    - name: Prepare ports tree
      if: ${{ inputs.ports == 'true' }}
      shell: bash
      env:
        OBA_PORTS_ARCHIVE_URL_PREFIX_INPUT: ${{ inputs.ports-archive-url-prefix }}
        OBA_PORTS_CVS_ROOT_INPUT: ${{ inputs.ports-cvs-root }}
        OBA_PORTS_CVS_REF_INPUT: ${{ inputs.ports-cvs-ref }}
      run: |
        set -euo pipefail

        {
          printf '%s\n' "$OBA_PORTS_ARCHIVE_URL_PREFIX_INPUT"
          printf '%s\n' "$OBA_PORTS_CVS_ROOT_INPUT"
          printf '%s\n' "$OBA_PORTS_CVS_REF_INPUT"
        } | ssh -F "$OBA_SSH_CONFIG" openbsd-action \
          '/tmp/openbsd-action-scripts/prepare-ports.sh'

    - name: Sync workspace in
      shell: bash
      run: >-
        rsync -a --rsync-path=/usr/local/bin/rsync -e "ssh -F $OBA_SSH_CONFIG"
        "$GITHUB_WORKSPACE/"
        openbsd-action:/home/openbsd/work/

    - name: Run command
      shell: bash
      env:
        OBA_RUN: ${{ inputs.run }}
      run: |
        set -euo pipefail
        set +e

        printf '%s\n' "$OBA_RUN" \
          | ssh -F "$OBA_SSH_CONFIG" openbsd-action 'cd /home/openbsd/work && exec sh -s'
        status=$?

        echo "OBA_STATUS=$status" >> "$GITHUB_ENV"
        exit 0

    - name: Sync workspace out
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail

        if [ ! -s "$OBA_QEMU_PID" ] || ! kill -0 "$(cat "$OBA_QEMU_PID")" 2>/dev/null; then
          exit 0
        fi

        rsync -a \
          --rsync-path=/usr/local/bin/rsync \
          -e "ssh -F $OBA_SSH_CONFIG" \
          openbsd-action:/home/openbsd/work/ \
          "$GITHUB_WORKSPACE/" \
          || [ -z "${OBA_STATUS:-}" ]

    - name: Print OpenBSD logs
      if: ${{ failure() }}
      shell: bash
      run: |
        [ ! -f "$OBA_CONSOLE_LOG" ] || cat "$OBA_CONSOLE_LOG" >&2
        [ ! -s "$OBA_QEMU_LOG" ] || cat "$OBA_QEMU_LOG" >&2

    - name: Stop OpenBSD
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail

        [ -s "$OBA_QEMU_PID" ] || exit 0
        pid="$(cat "$OBA_QEMU_PID")"
        kill "$pid" 2>/dev/null || exit 0
        sleep 5
        kill -9 "$pid" 2>/dev/null || true

    - name: Clean runtime
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail

        if [ "${OPENBSD_ACTION_KEEP_TEMP:-}" = 1 ]; then
          echo "keeping runtime at $OBA_ROOT"
        else
          rm -rf "$OBA_ROOT"
        fi

    - name: Exit with guest status
      if: ${{ always() }}
      shell: bash
      run: '[ -z "${OBA_STATUS:-}" ] || exit "$OBA_STATUS"'
